<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sign In</title>

        <link rel="stylesheet" href="../shared/shardStyle.css">
        <link rel="stylesheet" href="../auth/style.css">
    </head>
    <body>
        <main>
            <div id="logoDiv">
                <h1>Calo</h1>
                <img src="../assets/logo.png" alt="" id="logo">
            </div>
            <section id="siSection">
                <h2>Sign in</h2>
                <label for="">
                    <p>Email</p>
                    <input type="email" name="siEmailInput" id="siEmailInput">
                </label>
                <label for="">
                    <p>Password</p>
                    <input type="text" name="siPwdInput" id="siPwdInput">
                </label>
                <button class="btn s20">Sign in</button>
                <p class="s20">Don´t have an account? <span class="accentText">Sign up</span></p>
            </section>

            <section id="signUpSection">

            </section>
        </main>
    </body>
</html>
