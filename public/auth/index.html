<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Get started</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">   

        <link rel="stylesheet" href="/shared/sharedStyle.css">
        <link rel="stylesheet" href="/auth/style.css">

        <script src="/auth/main.js" defer></script>
    </head>
    <body>
        <main>
            <img src="../assets/logo.png" alt="">
            <section id="siSection">
                <h2>Sign in</h2>
                <label for="siUsernameInput">
                    Username
                    <input type="email" name="siUsernameInput" id="siUsernameInput">
                </label>
                <label for="siPwdInput" id="siPwdInputLabel">
                    Password
                    <div id="siPwdInputDiv">
                        <input type="password" name="siPwdInput" id="siPwdInput">
                        <div id="siEye">
                            <i class="fa-solid fa-eye" style="color: hsl(18, 5%, 43%);"></i>
                        </div>
                    </div>
                </label>
                <button class="btn s20" id="siSubmitBtn">Sign in</button>
                <p class="center">Don´t have an account? <span class="accentText" id="showsuSection">Sign up</span></p>
            </section>

            <section id="suSection">
                <h2>Sign up</h2>
                <label for="suUsernameInput">
                    Username
                    <input type="email" name="suUsernameInput" id="suUsernameInput">
                </label>
                <label for="suPwdInput" id="suPwdInputLabel">
                    Password
                    <div id="suPwdInputDiv">
                        <input type="password" name="suPwdInput" id="suPwdInput">
                        <div id="suEye">
                            <i class="fa-solid fa-eye" style="color: hsl(18, 5%, 43%);"></i>
                        </div>
                    </div>
                </label>
                <button class="btn s20" id="suSubmitBtn">Sign up</button>
                <p class="center">Already have an account? <span class="accentText" id="showsiSection">Sign in</span></p>
            </section>
        </main>
    </body>
</html>
