<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Dashboard</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">   

        <link rel="stylesheet" href="/shared/sharedStyle.css">
        <link rel="stylesheet" href="/style.css">

        <script src="/js/main.js" defer type="module"></script>
    </head>
    <body>
        <i class="fa-solid fa-bars" style="color: hsl(18, 5%, 43%);" id="menuToggleButton"></i>
        <aside>
            <section id="menuSection">
                <ul id="viewList">
                    <li id="mealsViewBtn">Meals</li>
                    <li id="dishesViewBtn">Dishes</li>
                    <li id="ingredientsViewBtn">Ingredients</li>
                </ul>
            </section>
        </aside>
        
        <main>
            <section id="mealsSection">
                <div id="dateFilter">
                    <i class="fa-solid fa-angle-left" style="color: hsl(18, 5%, 43%);" id="prevDayBtn"></i>
                    <input type="date" name="dateInput" id="dateInput">
                    <i class="fa-solid fa-angle-right" style="color: hsl(18, 5%, 43%);" id="postDayBtn"></i>
                </div>
            </section>

            <section id="ingredientsSection">
                <div id="ingredientsContainer">
                    <h2>Ingredients</h2>
                    <div id="ingrList">
                    </div>
                    <div id="ingredientBtns">
                        <button id="addIngrBtn" class="btn">
                            <i class="fa-solid fa-plus" style="color: hsl(18, 5%, 43%);"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>
        <div id="overlay"></div>
    </body>
</html>
